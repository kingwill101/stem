name: Portable API

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compile-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Show processor test formatter diff
        run: |
          cp packages/stem/test/unit/core/task_processor_test.dart /tmp/task_processor_test.dart
          dart format packages/stem/test/unit/core/task_processor_test.dart
          diff -u /tmp/task_processor_test.dart packages/stem/test/unit/core/task_processor_test.dart || true
      - name: Compile portable surface to JavaScript
        run: >-
          dart compile js packages/stem/tool/portable_compile.dart
          --output=/tmp/stem-portable.js
