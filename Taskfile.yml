version: "3"

# Compatibility aliases for contributors who still use go-task. The repository
# command implementation lives in repodoc; repodoc never invokes Task.
tasks:
  deps:
    desc: Resolve workspace and dashboard dependencies.
    cmds:
      - dart run repodoc/bin/repodoc.dart deps

  workspace:check:
    desc: Validate the discovered workspace package catalog.
    cmds:
      - dart run repodoc/bin/repodoc.dart workspace:check

  quality:dart:
    desc: Format and analyze every Dart package.
    cmds:
      - dart run repodoc/bin/repodoc.dart quality:dart

  standalone:dart:
    desc: Resolve Dart packages outside workspace overrides.
    cmds:
      - dart run repodoc/bin/repodoc.dart standalone:dart

  standalone:flutter:
    desc: Resolve Flutter packages outside workspace overrides.
    cmds:
      - dart run repodoc/bin/repodoc.dart standalone:flutter

  test:
    desc: Run all Dart package tests with integration services.
    cmds:
      - dart run repodoc/bin/repodoc.dart test

  test:no-env:
    desc: Run all non-Flutter package tests without service bootstrap.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:no-env

  test:flutter:
    desc: Analyze and test Flutter packages.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:flutter

  test:all:
    desc: Run the complete Dart and Flutter test gate.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:all

  test:contract:
    desc: Run adapter contract-heavy test suites.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:contract

  test:redis:
    desc: Run Redis adapter tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:redis

  test:postgres:
    desc: Run PostgreSQL adapter tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:postgres

  test:package:
    desc: Run one Dart package's tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package "{{.PACKAGE}}" {{.PACKAGE_ARGS | default ""}}

  coverage:
    desc: Run coverage for the core packages with services.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage

  coverage:no-env:
    desc: Run coverage for the core packages without service bootstrap.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:no-env

  coverage:package:
    desc: Run coverage for one Dart package.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package "{{.PACKAGE}}" --min "{{.MIN | default "80"}}" {{.PACKAGE_ARGS | default ""}}

  benchmark:throughput:
    desc: Run the in-memory throughput benchmark.
    cmds:
      - dart run repodoc/bin/repodoc.dart benchmark:throughput {{.BENCHMARK_ARGS | default ""}}

  profile:job:
    desc: Run the repeatable AOT Stem job profile.
    cmds:
      - dart run repodoc/bin/repodoc.dart profile:job --repetitions "{{.REPETITIONS | default "5"}}" {{.PROFILE_ARGS | default ""}}

  profile:job:aot:
    desc: Run the fresh-process AOT Stem job profile.
    cmds:
      - dart run repodoc/bin/repodoc.dart profile:job:aot --repetitions "{{.REPETITIONS | default "5"}}" {{.PROFILE_ARGS | default ""}}

  profile:job:vm:
    desc: Pause a job profile under the Dart VM service for DevTools.
    cmds:
      - dart run repodoc/bin/repodoc.dart profile:job:vm {{.PROFILE_ARGS | default ""}}

  demo:annotated:
    desc: Run the annotated workflows example.
    cmds:
      - dart run repodoc/bin/repodoc.dart demo:annotated

  demo:builder:
    desc: Run the stem_builder example.
    cmds:
      - dart run repodoc/bin/repodoc.dart demo:builder

  demo:ecommerce:test:
    desc: Run the ecommerce example test suite.
    cmds:
      - dart run repodoc/bin/repodoc.dart demo:ecommerce:test

  demo:all:
    desc: Run the healthy example demos.
    cmds:
      - dart run repodoc/bin/repodoc.dart demo:all

  dashboard:deps:
    desc: Resolve dashboard dependencies.
    cmds:
      - dart run repodoc/bin/repodoc.dart deps

  dashboard:test:
    desc: Run dashboard package tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/dashboard

  stem:test:
    desc: Run stem package tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem

  stem:coverage:
    desc: Run stem package coverage.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package packages/stem --min 80 --exclude-soak

  stem_adapter_tests:test:
    desc: Run adapter contract package tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_adapter_tests

  stem_builder:test:
    desc: Run builder package tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_builder

  stem_cli:test:
    desc: Run CLI package tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_cli

  stem_cli:test-multi:
    desc: Run CLI tests with multi-worker coverage enabled.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_cli --multi

  stem_cli:coverage:
    desc: Run CLI package coverage.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package packages/stem_cli --min 80

  stem_memory:test:
    desc: Run memory adapter tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_memory

  stem_memory:coverage:
    desc: Run memory adapter coverage.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package packages/stem_memory --min 0

  stem_postgres:test:
    desc: Run PostgreSQL adapter tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_postgres

  stem_postgres:coverage:
    desc: Run PostgreSQL adapter coverage.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package packages/stem_postgres --min 80

  stem_redis:test:
    desc: Run Redis adapter tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_redis

  stem_redis:coverage:
    desc: Run Redis adapter coverage.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package packages/stem_redis --min 80

  stem_sqlite:test:
    desc: Run SQLite adapter tests.
    cmds:
      - dart run repodoc/bin/repodoc.dart test:package --package packages/stem_sqlite

  stem_sqlite:coverage:
    desc: Run SQLite adapter coverage.
    cmds:
      - dart run repodoc/bin/repodoc.dart coverage:package --package packages/stem_sqlite --min 80
