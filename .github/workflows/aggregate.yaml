name: aggregate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: repository / hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject committed certificate and key fixtures
        shell: bash
        run: |
          set -euo pipefail
          matches="$(find packages -type f \( \
            -name '*.key' -o -name '*.pem' -o -name '*.crt' -o \
            -name '*.srl' -o -name '*.cnf' \
          \) -print)"
          if [[ -n "$matches" ]]; then
            printf 'Certificate/key-like files must be generated during test setup:\n%s\n' "$matches"
            exit 1
          fi
      - name: Reject duplicate legacy PostgreSQL CA path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e packages/stem_cli/docker/testing/certs/postgres-root.crt
          ! rg -n 'docker/testing/certs|certs/postgres-root' \
            packages .gitignore

  devenv-gate:
    name: integration / devenv centralized gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install devenv
        # Keep the CLI aligned with the pinned nixpkgs input in devenv.lock.
        run: >-
          nix profile install
          github:NixOS/nixpkgs/a831408e6378bc02ebf8cc09b52c96ca86f6bab4#devenv
      - name: Run the centralized workspace gate
        run: >-
          devenv shell
          --option services.postgres.enable:bool false
          --option services.redis.enable:bool false
          -- stem-ci

  cross-platform-packages:
    name: portable package / ${{ matrix.package }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - package: packages/stem
            tool: dart
            test_args: --exclude-tags soak --fail-fast
          - package: packages/stem_builder
            tool: dart
            test_args: --fail-fast
          - package: packages/stem_sqlite
            tool: dart
            test_args: --fail-fast
          - package: packages/stem_flutter
            tool: flutter
            test_args: --fail-fast
          - package: packages/stem_flutter_sqlite
            tool: flutter
            test_args: --fail-fast
          - package: packages/stem_memory
            tool: dart
            test_args: --fail-fast
          - package: packages/stem_adapter_tests
            tool: dart
            test_args: --fail-fast
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The root is a Dart workspace that also contains Flutter packages. Use
      # Flutter's pub frontend for every portable package so Dart-only entries
      # can resolve the workspace on both runners as well.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve package dependencies
        run: flutter pub get
        working-directory: ${{ matrix.package }}
      - name: Check package formatting
        run: dart format lib test --set-exit-if-changed
        working-directory: ${{ matrix.package }}
      - name: Analyze package
        run: ${{ matrix.tool }} analyze --fatal-infos
        working-directory: ${{ matrix.package }}
      - name: Test package
        run: ${{ matrix.tool }} test ${{ matrix.test_args }}
        working-directory: ${{ matrix.package }}
