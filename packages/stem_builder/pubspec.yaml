name: stem_builder
description: Build-time registry generator for annotated Stem workflows and tasks.
version: 0.3.0

repository: https://github.com/kingwill101/stem
resolution: workspace
environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  analyzer: ^14.1.0
  build: ^4.0.4
  dart_style: ^3.1.4
  glob: ^2.1.3
  source_gen: ^4.1.2
  stem: ">=0.3.0 <0.4.0"

dev_dependencies:
  build_runner: ^2.10.5
  build_test: any
  lints: ^6.0.0
  test: ^1.31.2
  very_good_analysis: ^10.0.0
